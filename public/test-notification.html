<!DOCTYPE html>
<html>
<head>
    <title>Test Notification</title>
</head>
<body>
    <h1>Test Push Notification</h1>
    <button id="testBtn">Test Basic Notification</button>
    <button id="testPushBtn">Test Push Notification</button>
    
    <script>
        // Test basic notification
        document.getElementById('testBtn').addEventListener('click', async () => {
            if ('Notification' in window) {
                const permission = await Notification.requestPermission();
                if (permission === 'granted') {
                    new Notification('Test Basic Notification', {
                        body: 'This is a test notification',
                        icon: '/icons/icon-192x192.png'
                    });
                }
            }
        });
        
        // Test push notification
        document.getElementById('testPushBtn').addEventListener('click', async () => {
            if ('serviceWorker' in navigator && 'PushManager' in window) {
                try {
                    const registration = await navigator.serviceWorker.register('/sw.js');
                    await navigator.serviceWorker.ready;
                    
                    const subscription = await registration.pushManager.subscribe({
                        userVisibleOnly: true,
                        applicationServerKey: 'BEnVHfiLHAtdpeAeaGilFOHUo3GmaFxXhqQK-Lmsxb-ZpFndR2CJ_MgIo5P_DyQIpgtYqnmuuPZv78CxgSbd0uc'
                    });
                    
                    console.log('Subscription:', subscription);
                    
                    // Send test notification
                    fetch('/api/test/notifications', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            type: 'APPOINTMENT_REMINDER',
                            patientId: 8,
                            data: {
                                appointmentId: 1,
                                doctorName: 'Dr. Test',
                                time: '12:30 PM'
                            }
                        })
                    });
                } catch (error) {
                    console.error('Error:', error);
                }
            }
        });
    </script>
</body>
</html>
