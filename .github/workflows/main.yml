name: Deploy to QA (Vercel, unlinked) - Debug Version
on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to deploy'
        required: false
        default: 'dev'
        type: string

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.set.outputs.branch }}
    steps:
      - id: set
        env:
          BRANCH: ${{ inputs.target_branch != '' && inputs.target_branch || (vars.QA_DEPLOY_BRANCH != '' && vars.QA_DEPLOY_BRANCH || 'dev') }}
        run: echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: resolve
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == needs.resolve.outputs.branch }}
    runs-on: ubuntu-latest
    concurrency:
      group: qa-deploy-${{ needs.resolve.outputs.branch }}
      cancel-in-progress: false
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      NODE_OPTIONS: --max-old-space-size=6144
      NEXT_DISABLE_SOURCEMAPS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.branch }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      # Debug: Check package.json and next.config
      - name: Debug - Check project configuration
        run: |
          echo "=== Package.json scripts ==="
          cat package.json | jq '.scripts'
          echo ""
          echo "=== Next.js config (if exists) ==="
          if [ -f "next.config.js" ]; then
            cat next.config.js
          elif [ -f "next.config.mjs" ]; then
            cat next.config.mjs
          else
            echo "No next.config found"
          fi

      - name: Link Vercel project
        run: npx vercel link --project "$VERCEL_PROJECT_ID" --yes --token "$VERCEL_TOKEN"

      - name: Pull Vercel project settings
        run: npx vercel pull --yes --environment=production --token "$VERCEL_TOKEN"

      # Debug: Check what Vercel pulled
      - name: Debug - Check Vercel config
        run: |
          echo "=== .vercel/project.json ==="
          cat .vercel/project.json || echo "No project.json found"
          echo ""
          echo "=== .env.production (first 5 lines) ==="
          head -n 5 .env.production 2>/dev/null || echo "No .env.production found"

      - name: Pull env vars → .env.production
        run: npx vercel env pull .env.production --environment=production --token "$VERCEL_TOKEN"

      # Try regular build first to see what gets created
      - name: Debug - Try regular npm build
        run: |
          echo "=== Running npm run build ==="
          npm run build
          echo ""
          echo "=== Files created after build ==="
          ls -la
          echo ""
          echo "=== .next directory contents ==="
          ls -la .next/ || echo "No .next directory found"
          echo ""
          echo "=== out directory contents (if exists) ==="
          ls -la out/ || echo "No out directory found"

      # Now try Vercel build
      - name: Build (Vercel)
        run: |
          echo "=== Running vercel build ==="
          npx vercel build --prod --token "$VERCEL_TOKEN"
          echo ""
          echo "=== Files after Vercel build ==="
          ls -la
          echo ""
          echo "=== .vercel/output contents ==="
          find .vercel/output -type f | head -20 || echo "No .vercel/output found"

      - name: Deploy (prebuilt) to QA
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Vercel deploy output ==="
          DEPLOY_OUTPUT=$(npx vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN" 2>&1)
          echo "$DEPLOY_OUTPUT"
          DEPLOY_URL=$(echo "$DEPLOY_OUTPUT" | grep -E 'https://.*\.vercel\.app' | tail -n1 | tr -d '\r\n[:space:]')
          if [ -z "$DEPLOY_URL" ]; then
            echo "Could not extract deployment URL from output"
            exit 1
          fi
          echo "Extracted URL: $DEPLOY_URL"
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            echo "### QA Deployment ✅"
            echo ""
            echo "- **Branch:** \`${{ needs.resolve.outputs.branch }}\`"
            echo "- **Deployment URL:** ${{ steps.deploy.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"
