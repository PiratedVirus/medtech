name: Deploy to QA (Vercel, unlinked)

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to deploy'
        required: false
        default: 'dev'
        type: string

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.set.outputs.branch }}
    steps:
      - id: set
        # Priority: manual input → repo variable → fallback 'dev'
        env:
          BRANCH: ${{ inputs.target_branch != '' && inputs.target_branch || (vars.QA_DEPLOY_BRANCH != '' && vars.QA_DEPLOY_BRANCH || 'dev') }}
        run: echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: resolve
    # Run on pushes to the resolved branch OR on manual runs
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == needs.resolve.outputs.branch }}
    runs-on: ubuntu-latest
    concurrency:
      group: qa-deploy-${{ needs.resolve.outputs.branch }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.branch }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - name: Link Vercel project (ephemeral)
        run: npx vercel link --project care-diabetics-qa --yes --token ${{ secrets.VERCEL_TOKEN }}

      - name: Pull Vercel project settings
        run: npx vercel pull --yes --environment=production --token ${{ secrets.VERCEL_TOKEN }}

      - name: Pull env vars → .env.production
        run: npx vercel env pull .env.production --environment=production --token ${{ secrets.VERCEL_TOKEN }}

      - name: Build (Vercel)
        run: npx vercel build --prod --token ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy (prebuilt) to QA
        run: >
          npx vercel deploy --prebuilt --prod
          --project ${{ secrets.VERCEL_PROJECT_ID_QA }}
          --scope   ${{ secrets.VERCEL_ORG_ID }}
          --token   ${{ secrets.VERCEL_TOKEN }}
