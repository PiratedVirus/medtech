name: Deploy to DEV server

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Vercel environment to deploy to (preview or production)"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production
      build_mode:
        description: "Build mode: cloud (uploads source; builds on Vercel) or prebuilt (local build)"
        required: true
        default: cloud
        type: choice
        options:
          - cloud
          - prebuilt
      ref:
        description: "Git branch to deploy"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm i -g vercel@32.5.0

      - name: Verify Vercel authentication
        run: |
          vercel whoami --token "$VERCEL_TOKEN"

      - name: Create vercel.json for deployment
        run: |
          cat > vercel.json << 'EOF'
          {
            "framework": "nextjs",
            "buildCommand": "npm run build",
            "devCommand": "npm run dev",
            "installCommand": "npm install",
            "outputDirectory": ".next",
            "functions": {
              "app/api/**/*.ts": {
                "maxDuration": 60
              }
            },
            "env": {
              "NODE_ENV": "production"
            }
          }
          EOF

      - name: Link Vercel project (Project B)
        run: |
          vercel link --project "$VERCEL_PROJECT_ID" --yes --token "$VERCEL_TOKEN"

      - name: Verify project link
        run: |
          vercel project ls --token "$VERCEL_TOKEN"

      - name: Pull Vercel env from Project B
        run: |
          vercel pull --yes --environment=${{ inputs.environment }} --token "$VERCEL_TOKEN"

      - name: Build (prebuilt output)
        if: ${{ inputs.build_mode == 'prebuilt' }}
        run: |
          if [ "${{ inputs.environment }}" = "production" ]; then PROD_FLAG="--prod"; else PROD_FLAG=""; fi
          vercel build $PROD_FLAG --token "$VERCEL_TOKEN"

      - name: Deploy
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          echo "Environment: ${{ inputs.environment }}"
          echo "Build mode: ${{ inputs.build_mode }}"
          
          if [ "${{ inputs.environment }}" = "production" ]; then 
            PROD_FLAG="--prod"
          else 
            PROD_FLAG=""
          fi
          
          if [ "${{ inputs.build_mode }}" = "prebuilt" ]; then
            echo "Running prebuilt deployment..."
            DEPLOY_OUTPUT=$(vercel deploy --prebuilt $PROD_FLAG --token "$VERCEL_TOKEN" 2>&1)
          else
            echo "Running cloud deployment..."
            DEPLOY_OUTPUT=$(vercel deploy $PROD_FLAG --token "$VERCEL_TOKEN" 2>&1)
          fi
          
          echo "Deploy output:"
          echo "$DEPLOY_OUTPUT"
          
          # Extract URL from output
          URL=$(echo "$DEPLOY_OUTPUT" | grep -o 'https://[^[:space:]]*' | tail -n1)
          if [ -z "$URL" ]; then
            echo "Failed to extract deployment URL"
            echo "Full output:"
            echo "$DEPLOY_OUTPUT"
            exit 1
          fi
          
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Deployed to: $URL"

      - name: Add deployment URL to summary
        if: success()
        run: |
          echo "### Vercel Deployment" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: ${{ steps.deploy.outputs.url }}" >> $GITHUB_STEP_SUMMARY

    outputs:
      deployment_url: ${{ steps.deploy.outputs.url }}
